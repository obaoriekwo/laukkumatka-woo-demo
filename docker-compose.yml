# Local WordPress + WooCommerce demo store.
#   docker compose up -d
#   docker compose run --rm cli bash /project/bin/setup.sh
# Shop: http://localhost:8080   Admin: http://localhost:8080/wp-admin (admin / admin)
# Also works in GitHub Codespaces (the public address is detected automatically).

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      # Note: "$$" is how docker-compose writes a literal "$" for PHP.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        if ( getenv( 'CODESPACE_NAME' ) && getenv( 'GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN' ) ) {
          $$laukku_host = getenv( 'CODESPACE_NAME' ) . '-8080.' . getenv( 'GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN' );
          $$_SERVER['HTTP_HOST'] = $$laukku_host;
          $$_SERVER['HTTPS'] = 'on';
          define( 'WP_HOME', 'https://' . $$laukku_host );
          define( 'WP_SITEURL', 'https://' . $$laukku_host );
        }
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/laukku-storefront-child:/var/www/html/wp-content/themes/laukku-storefront-child
      - ./wp-content/plugins/laukku-travel-tools:/var/www/html/wp-content/plugins/laukku-travel-tools

  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/laukku-storefront-child:/var/www/html/wp-content/themes/laukku-storefront-child
      - ./wp-content/plugins/laukku-travel-tools:/var/www/html/wp-content/plugins/laukku-travel-tools
      - .:/project:ro
    profiles: ["tools"]

volumes:
  db_data:
  wp_data:
