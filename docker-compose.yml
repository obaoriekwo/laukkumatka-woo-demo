# Local WordPress + WooCommerce demo store.
#   docker compose up -d
#   docker compose run --rm cli bash /project/bin/setup.sh
# Shop: http://localhost:8080   Admin: http://localhost:8080/wp-admin (admin / admin)
# phpMyAdmin is not included on purpose – use `docker compose run --rm cli wp db query`.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp_data:/var/www/html
      # Our code is mounted live – edit files, refresh the browser.
      - ./wp-content/themes/laukku-storefront-child:/var/www/html/wp-content/themes/laukku-storefront-child
      - ./wp-content/plugins/laukku-travel-tools:/var/www/html/wp-content/plugins/laukku-travel-tools

  cli:
    image: wordpress:cli-php8.3
    # The CLI image runs as uid 82 by default; match Apache's www-data (33)
    # so files it creates are writable by WordPress.
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/laukku-storefront-child:/var/www/html/wp-content/themes/laukku-storefront-child
      - ./wp-content/plugins/laukku-travel-tools:/var/www/html/wp-content/plugins/laukku-travel-tools
      - .:/project:ro
    profiles: ["tools"]

volumes:
  db_data:
  wp_data:
